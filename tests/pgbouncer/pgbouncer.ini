; PgBouncer in front of the test PostgreSQL, for tests/test_pool.py
; (docs/EPIC7_DESIGN.md §3.4). Transaction mode, two server connections per
; pool, no prepared-statement support: the strictest pooler a stage meets.
; @HOST@ and @PORT@ are the server's; CI writes postgres and 5432. Roles the
; tests create log in through auth_query, as the server's admin looks them up.

[databases]
* = host=@HOST@ port=@PORT@

[pgbouncer]
listen_addr = 0.0.0.0
listen_port = 6432
auth_type = scram-sha-256
auth_file = /etc/pgbouncer/userlist.txt
auth_user = interlock_admin
auth_query = SELECT usename, passwd FROM pg_shadow WHERE usename=$1
pool_mode = transaction
default_pool_size = 2
max_client_conn = 500
query_wait_timeout = 15
max_prepared_statements = 0
