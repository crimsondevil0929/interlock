[project]
name = "interlock"
version = "0.1.2"
description = "A reference monitor for agent side effects: stage, measure, adjudicate, commit."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [{ name = "Edward Gu", email = "ygu0929@uchicago.edu" }]
keywords = [
    "agents",
    "llm",
    "zero-trust",
    "reference-monitor",
    "prompt-injection",
    "escrow",
    "audit",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
    "Typing :: Typed",
]
# agentgov is consumed read-only, as an audit dependency. See src/interlock/anchor.py.
#
# A PEP 508 direct reference rather than a [tool.uv.sources] entry. uv sources
# are workspace configuration and are not written into built distribution
# metadata, so a wheel built from one declares a bare `agentgov` requirement
# that resolves against PyPI. A direct reference travels in the metadata, so
# `pip install git+...interlock` and installing the built artifact both work.
#
# The cost is that PyPI rejects direct-URL dependencies, so interlock cannot be
# published there while this line stands. Publishing means putting agentgov on
# PyPI and pinning a version range here instead.
#
# Pinned to an exact agentgov commit, never a branch: `@main` resolved to
# whatever main was when the lock was cut, which is how interlock 0.1.1 came to
# lock an agentgov commit that reported itself as 0.1.0.
#
# PRE-RELEASE PIN. Interlock 0.3 issues ARC1 receipts, which exist only on
# agentgov's main (6d3cac2, the receipts merge) and in no tag yet; that
# commit still reports version 0.1.2. Before interlock 0.3 is released,
# agentgov must tag a release containing it and this line must name that tag.
dependencies = [
    "agentgov @ git+https://github.com/crimsondevil0929/agentgov@6d3cac212c5a4e01a2981f26a466c87e8942f975",
]

[project.scripts]
interlock = "interlock.cli:main_entry"

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.2"]

[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.6.0",
    "mypy>=1.11.0",
    # The PostgreSQL substrate's integration tests. The runtime dependency is
    # the `postgres` extra; this puts the driver in every dev environment.
    "psycopg[binary]>=3.2",
    # Property tests: the zero-leak guarantee on agent feedback is a property
    # over every plan and diff, not a list of examples.
    "hypothesis>=6.100",
    # scripts/live_stress_test.py only. Not a runtime dependency: nothing in
    # src/ imports it, and the library never talks to a model provider.
    "anthropic>=1.0.0",
]

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra --strict-markers --strict-config"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "N", "S", "RUF"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
# Tests build SQL from table names they define themselves, to seed and count
# fixtures; no value in them comes from outside the test.
"tests/**/*.py" = ["S101", "S608"]
# The capture triggers interpolate table and column names because SQL has no
# parameter binding for identifiers in DDL. Every identifier is validated by
# substrate._assert_identifier at TableSpec construction and comes from
# operator configuration, never from the agent.
"src/interlock/substrate.py" = ["S608"]
# The same, for the PostgreSQL install DDL and catalog queries: identifiers are
# validated TableSpec names, and the rest is constant SQL joined together.
"src/interlock/postgres.py" = ["S608"]
# The SQLite journal DDL and reads, over the same validated names and constants.
"src/interlock/reconcile.py" = ["S608"]

[tool.mypy]
python_version = "3.11"
mypy_path = "src"
packages = ["interlock"]
strict = true
warn_unused_ignores = true
warn_redundant_casts = true
show_error_codes = true
