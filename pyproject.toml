[project]
name = "interlock-escrow"
version = "1.1.0"
description = "A reference monitor for agent side effects: stage, measure, adjudicate, commit."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [{ name = "Edward Gu", email = "ygu0929@uchicago.edu" }]
keywords = [
    "agents",
    "llm",
    "zero-trust",
    "reference-monitor",
    "prompt-injection",
    "escrow",
    "audit",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Security",
    "Typing :: Typed",
]
dependencies = [
    "interlock-agentgov>=1.0.0",
]

[project.scripts]
interlock = "interlock.cli:main_entry"

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.2"]
# Signing with an Ed25519 key: a relay's attestations (interlock relay), an
# operator's records (interlock outbox release, compensate...), an inbox's
# (interlock inbox serve, which also verifies SendGrid's ECDSA signatures).
# Verifying any of them needs nothing extra.
sign = ["interlock-agentgov[sign]>=1.0.0"]
# Signing with an Ed25519 key held by AWS KMS (interlock.signers.AwsKmsSigner,
# AgentGov's own): boto3, through AgentGov's extra.
kms-aws = ["interlock-agentgov[kms-aws]>=1.0.0"]
# AgentGov's OpenTelemetry metrics (agentgov.otel.OpenTelemetryMetrics), for a
# governor Interlock anchors to.
otel = ["interlock-agentgov[otel]>=1.0.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.6.0",
    "mypy>=1.11.0",
    # The PostgreSQL substrate's integration tests. The runtime dependency is
    # the `postgres` extra; this puts the driver in every dev environment.
    "psycopg[binary]>=3.2",
    # Property tests: the zero-leak guarantee on agent feedback is a property
    # over every plan and diff, not a list of examples.
    "hypothesis>=6.100",
    # scripts/live_gauntlet.py only. Not a runtime dependency: nothing in
    # src/ imports it, and the library never talks to a model provider.
    "anthropic>=1.0.0",
    "cryptography>=42",
]

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra --strict-markers --strict-config"
testpaths = ["tests"]
# A test still running after five minutes has every thread's stack dumped, so
# a hang shows where it is.
faulthandler_timeout = 300
# A deprecated call is an error here, not a warning: agentgov 1.0 deprecates
# what 2.0 removes, and Interlock makes none of those calls.
filterwarnings = ["error::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "N", "S", "RUF"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
# Tests build SQL from table names they define themselves, to seed and count
# fixtures; no value in them comes from outside the test. And they sign with
# secrets they make up, which name nothing real (S105, S106).
"tests/**/*.py" = ["S101", "S105", "S106", "S608"]
"tests/test_git_substrate.py" = ["S101", "S105", "S106", "S603", "S607", "S608"]
# The capture triggers interpolate table and column names because SQL has no
# parameter binding for identifiers in DDL. Every identifier is validated by
# substrate._assert_identifier at TableSpec construction and comes from
# operator configuration, never from the agent.
"src/interlock/substrate.py" = ["S608"]
"src/interlock/git_substrate.py" = ["S608"]
# The same, for the PostgreSQL install DDL and catalog queries: identifiers are
# validated TableSpec names, and the rest is constant SQL joined together.
"src/interlock/postgres.py" = ["S608"]
# The SQLite journal DDL and reads, over the same validated names and constants.
"src/interlock/reconcile.py" = ["S608"]
# The SQLite outbox: its own four table names, module constants, joined into
# constant SQL; every value is a bound parameter.
"src/interlock/sqlite_outbox.py" = ["S608"]
# The inbox's schema (both stores) and its stores: module constants joined
# into constant SQL; every value is a bound parameter.
"src/interlock/inbox_sql.py" = ["S608"]
"src/interlock/inbox_store.py" = ["S608"]
# The soak draws its workload from seeded generators, so a run can be
# reproduced; every secret it makes comes from `secrets` (S311). It runs
# docker by name, as its operator would (S603, S607).
"scripts/live_stress_test.py" = ["S311", "S603", "S607"]
# The acceptance suite builds SQL from the table and column names its own
# domain definitions declare (S608): nothing the model sends is interpolated,
# and the model's statements run only through the engine. It asks git for the
# commit it ran at (S603, S607).
"demo/customer_acceptance_suite.py" = ["S603", "S607", "S608"]

[tool.mypy]
python_version = "3.11"
mypy_path = "src"
packages = ["interlock"]
strict = true
warn_unused_ignores = true
warn_redundant_casts = true
show_error_codes = true

# Explicitly tell the build system where the module is
[tool.uv_build]
packages = ["src/interlock"]

[tool.hatch.build.targets.wheel]
packages = ["src/interlock"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["interlock*"]
