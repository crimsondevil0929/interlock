[project]
name = "interlock"
version = "0.1.0"
description = "A reference monitor for agent side effects: stage, measure, adjudicate, commit."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [{ name = "Edward Gu", email = "ygu0929@uchicago.edu" }]
keywords = [
    "agents",
    "llm",
    "zero-trust",
    "reference-monitor",
    "prompt-injection",
    "escrow",
    "audit",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
    "Typing :: Typed",
]
# agentgov is consumed read-only, as an audit dependency. See src/interlock/anchor.py.
dependencies = ["agentgov"]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.2"]

[tool.uv.sources]
agentgov = { path = "../agentgov" }

[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.6.0",
    "mypy>=1.11.0",
]

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra --strict-markers --strict-config"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "N", "S", "RUF"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101"]
# The capture triggers interpolate table and column names because SQL has no
# parameter binding for identifiers in DDL. Every identifier is validated by
# substrate._assert_identifier at TableSpec construction and comes from
# operator configuration, never from the agent.
"src/interlock/substrate.py" = ["S608"]

[tool.mypy]
python_version = "3.11"
mypy_path = "src"
packages = ["interlock"]
strict = true
warn_unused_ignores = true
warn_redundant_casts = true
show_error_codes = true
